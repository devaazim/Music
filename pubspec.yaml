name: tunely
description: A music streaming app built on a legal catalog (Audius), with a swappable catalog layer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.10.0
  just_audio_background: ^0.0.1-beta.17
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
